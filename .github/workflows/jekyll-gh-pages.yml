# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["new"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # (experiment) Create Tor onion
  deploy-tor:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: (experiment) Deploy Tor onion
        id: tor-deployment
        run: |
          sudo bash -c '. /etc/lsb-release; mkdir -p /etc/apt/sources.list.d/; echo "deb     [signed-by=/usr/share/keyrings/deb.torproject.org-keyring.gpg] https://deb.torproject.org/torproject.org $DISTRIB_CODENAME main" > /etc/apt/sources.list.d/tor.list'
          sudo bash -c '. /etc/lsb-release; echo "deb-src [signed-by=/usr/share/keyrings/deb.torproject.org-keyring.gpg] https://deb.torproject.org/torproject.org $DISTRIB_CODENAME main" >> /etc/apt/sources.list.d/tor.list'
          cat /etc/apt/sources.list.d/tor.list
          sudo wget -qO- https://deb.torproject.org/torproject.org/A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89.asc | gpg --dearmor | tee /usr/share/keyrings/deb.torproject.org-keyring.gpg >/dev/null
          sudo apt update
          sudo apt install tor deb.torproject.org-keyring
          sudo bash -c 'echo "$(pwd)"; mkdir -p $(pwd)/_onion/; echo "HiddenServiceDir $(pwd)/_onion/" > /etc/tor/torrc'
          sudo bash -c 'echo "HiddenServicePort 80 127.0.0.1:4000" >> /etc/tor/torrc'
          sudo systemctl restart tor
          jekyll serve --port 4000 &
          ls ./_onion/
          cat ./_onion/
          sleep 60m
