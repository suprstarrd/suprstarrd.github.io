<!DOCTYPE html>
<html>
  <head>
    <title>Exoracer pronoun clubs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        font-family: Helvetica;
      }
      body {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      a {
        color: rgb(0, 64, 255);
        text-decoration: none;
        position: relative;
        transition: color 0.25s;
      }
      a:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        border-bottom: 2px solid rgb(0, 128, 255);
        transition: 0.4s;
      }
      a:hover:after {
        width: 100%;
        color: rgb(0, 128, 255);
      }
      a:hover {
        color: rgb(0, 128, 255);
      }
      @media (prefers-color-scheme: dark) {
       a {
          color: rgb(0, 128, 255);
          text-decoration: none;
          position: relative;
          transition: color 0.25s;
        }
        a:after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 0;
          width: 0%;
          border-bottom: 2px solid rgb(78, 166, 255);
          transition: 0.4s;
        }
        a:hover:after {
          width: 100%;
          color: rgb(78, 166, 255);
        }
        a:hover {
          color: rgb(78, 166, 255); 
        }
      }
    </style>
  </head>
  <body>
    <h1><u><i>Exoracer pronoun clubs</i></u> [<a href="https://www.npr.org/2021/06/02/996319297/gender-identity-pronouns-expression-guide-lgbtq">why?</a>]</h1>
    <p><a href="https://exostats.nl/club/ff1Wb4KwBS20UrykpHvh">she/her (ff1Wb4KwBS20UrykpHvh)</a></p>
  </body>
</html>
