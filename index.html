  <style>
    /*** Actual website styles ***/
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    * {
      font-family: Helvetica;
    }

    body {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    a {
      color: rgb(0, 64, 255);
      text-decoration: none;
      position: relative;
      transition: color 0.25s;
    }

    a:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      border-bottom: 2px solid rgb(0, 128, 255);
      transition: 0.4s;
    }

    a:hover:after {
      width: 100%;
      color: rgb(0, 128, 255);
    }

    a:hover {
      color: rgb(0, 128, 255);
    }

    @media (prefers-color-scheme: dark) {
      a {
        color: rgb(0, 128, 255);
        text-decoration: none;
        position: relative;
        transition: color 0.25s;
      }

      a:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        border-bottom: 2px solid rgb(78, 166, 255);
        transition: 0.4s;
      }

      a:hover:after {
        width: 100%;
        color: rgb(78, 166, 255);
      }

      div[id="88x31"] a:hover:after {
        width: 0%;
      }

      div[id="88x31"] a>img {
        filter: sepia(0%) saturate(100%) brightness(100%) hue-rotate(0deg);
        transition: 0.4s;
      }

      div[id="88x31"] a:hover>img {
        filter: sepia(100%) saturate(300%) brightness(70%) hue-rotate(90deg);
        transition: 0.4s;
      }

      div[id="88x31"] a:hover>img:after {
        width: 100%;
        border-bottom: 2px solid rgb(78, 166, 255);
        transition: 0.4s;
      }

      div[id="webring"] a:hover:after {
        width: 0%;
      }

      div[id="webring"] a>img {
        filter: sepia(0%) saturate(100%) brightness(100%) hue-rotate(0deg);
        transition: 0.4s;
      }

      div[id="webring"] a:hover>img {
        filter: sepia(100%) saturate(300%) brightness(70%) hue-rotate(90deg);
        transition: 0.4s;
      }

      div[id="webring"] a:hover>img:after {
        width: 100%;
        border-bottom: 2px solid rgb(78, 166, 255);
        transition: 0.4s;
      }

      div[id="88x31"] a>object {
        filter: sepia(0%) saturate(100%) brightness(100%) hue-rotate(0deg);
        transition: 0.4s;
      }

      div[id="88x31"] a:hover>object {
        filter: sepia(100%) saturate(300%) brightness(70%) hue-rotate(90deg);
        transition: 0.4s;
      }

      div[id="88x31"] a:hover>object:after {
        width: 100%;
        border-bottom: 2px solid rgb(78, 166, 255);
        transition: 0.4s;
      }

      a:hover {
        color: rgb(78, 166, 255);
      }
    }

    /* Ring owner requests for widget to be hidden until you are part of the ring */
    .droidringwidget {
      display: none;
    }

    #palestinering {
      display: none;
    }

    /* DROIDRING styles */
    .droidringwidget {
      font-family: 'Droid Sans', sans-serif;
      align-content: center;
      text-align: center;
      width: 215px;
      border: 1px solid #666666;
      background: linear-gradient(0deg, black, #000000db);
      padding: 5px;
    }

    .buttonsdroidring {
      background: #989898;
      padding: 4px;
      margin: -5px;
    }

    .navdroidring {
      background: linear-gradient(to bottom, #F1F1F1, #B8B8B8);
      padding: 5px;
      color: black;
      box-shadow: 0 3px 6px #00000029, 0 3px 6px #0000003B;
      border: none;
      width: 50px;
      height: 27px;
      min-width: 50px;
    }

    .navdroidring:active {
      background: linear-gradient(to bottom, #FFD554, #E99D00);
    }

    /* .navdroidring:hover {
